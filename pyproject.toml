[project]
name = "pc-doctor"
version = "0.1.0"
description = "Local web dashboard to monitor and diagnose a Linux PC (hardware, network, ports, accounts, permissions, logs)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psutil>=7.2.2",
    "uvicorn>=0.30",
]

[project.scripts]
pc-doctor = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
